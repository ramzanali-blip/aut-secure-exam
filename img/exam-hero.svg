<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Laptop with code, a graded test list and a shield">
  <!-- Original illustration for the Secure Exam system, in Ajou University blue (#0A5DAC) and gold (#BC8A2C). -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A5DAC"/>
      <stop offset="1" stop-color="#084A8A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A748"/>
      <stop offset="1" stop-color="#BC8A2C"/>
    </linearGradient>
  </defs>

  <!-- soft backdrop shapes -->
  <circle cx="240" cy="186" r="150" fill="#0A5DAC" opacity=".08"/>
  <path d="M60 80 l22 -38 h44 l22 38 l-22 38 h-44z" fill="none" stroke="#BC8A2C" stroke-width="3" opacity=".45"/>
  <path d="M380 270 l14 -24 h28 l14 24 l-14 24 h-28z" fill="#BC8A2C" opacity=".25"/>
  <circle cx="410" cy="70" r="6" fill="#BC8A2C"/>
  <circle cx="70" cy="260" r="4" fill="#0A5DAC" opacity=".5"/>

  <!-- laptop -->
  <rect x="112" y="78" width="256" height="164" rx="12" fill="#1C2433"/>
  <rect x="122" y="88" width="236" height="144" rx="6" fill="url(#screen)"/>
  <path d="M84 250 h312 l-18 22 a8 8 0 0 1 -6 3 h-264 a8 8 0 0 1 -6 -3z" fill="#2A3445"/>
  <rect x="208" y="250" width="64" height="6" rx="3" fill="#465266"/>

  <!-- code on screen -->
  <g font-family="Consolas, monospace" font-size="11" fill="#FFFFFF">
    <text x="136" y="110" fill="#F2C46D">def</text><text x="160" y="110"> solve(a, b):</text>
    <text x="150" y="128" opacity=".9">return a + b</text>
    <text x="136" y="152" fill="#9EC3EE">print</text><text x="172" y="152">(solve(2, 3))</text>
  </g>
  <rect x="136" y="166" width="90" height="6" rx="3" fill="#FFFFFF" opacity=".25"/>
  <rect x="136" y="180" width="130" height="6" rx="3" fill="#FFFFFF" opacity=".18"/>

  <!-- test results panel -->
  <rect x="272" y="160" width="76" height="62" rx="6" fill="#FFFFFF" opacity=".95"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#1C2433">
    <circle cx="283" cy="173" r="4" fill="#18A058"/><text x="292" y="176">Test 1</text>
    <circle cx="283" cy="188" r="4" fill="#18A058"/><text x="292" y="191">Test 2</text>
    <circle cx="283" cy="203" r="4" fill="#D4453A"/><text x="292" y="206">Test 3</text>
  </g>
  <text x="335" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#0A5DAC" text-anchor="end">8/10</text>

  <!-- shield with check -->
  <g transform="translate(330 46)">
    <path d="M40 0 L76 14 V44 C76 70 60 88 40 98 C20 88 4 70 4 44 V14 Z" fill="url(#gold)"/>
    <path d="M40 10 L66 20 V44 C66 63 55 77 40 86 C25 77 14 63 14 44 V20 Z" fill="#FFFFFF" opacity=".18"/>
    <path d="M24 50 l11 11 l22 -24" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- clock -->
  <g transform="translate(70 120)">
    <circle cx="28" cy="28" r="28" fill="#FFFFFF" stroke="#0A5DAC" stroke-width="5"/>
    <path d="M28 12 V28 L40 36" fill="none" stroke="#BC8A2C" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
